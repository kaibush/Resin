<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Resin · Sticky Proxy Pool</title>
    <script>
      ;(function () {
        var site = '%VITE_VISORA_SITE_ID%'
        var base = '%VITE_VISORA_URL%'
        if (!site || site.charAt(0) === '%' || !base || base.charAt(0) === '%')
          return
        var script = document.createElement('script')
        script.defer = true
        script.src = base.replace(/\/$/, '') + '/tracker.js'
        script.setAttribute('data-site', site)
        script.setAttribute('data-wait-for-user', 'true')
        document.head.appendChild(script)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
